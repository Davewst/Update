name: Notify consumer repo

on:
  push:
    branches: ["main"]
    paths: [ 'actions.yml']
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      
      REPOS: |
        eliuma/dev-actions
        eliuma/project-sim
    
    steps:
      - name: Dispatch build
        run: |
          set -u
          FAILED=0
          for REPO in ${REPOS}; do
            echo "Dispatching to ${REPO}"
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.FLEET_DISPATCH_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "${GITHUB_API_URL}/repos/${REPO}/dispatches" \
              -d '{"event_type":"Update", "client_payload":{"action_sha":"${{ github.sha }}"}}')
            echo "HTTP ${CODE}"
            cat /tmp/resp.json || true
            if [ "$CODE" -ne 204 ]; then
              echo "Failed to dispatch to ${REPO} (HTTP ${CODE})"
              FAILED=1
            fi
          done
          exit $FAILED
       
