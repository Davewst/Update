name: "Trivy Security Scan"
description: "Scan a repo or image with Trivy and report findings grouped by the image layer that introduced them."

inputs:
  scan-type:
    description: "fs, image, repo, rootfs, or config. Forced to image when image-ref is set."
    required: false
    default: "fs"
  scan-ref:
    description: "Path or target to scan when image-ref is empty."
    required: false
    default: "."
  image-ref:
    description: "Container image to scan. Overrides scan-ref."
    required: false
    default: ""
  scanners:
    description: "Comma-separated scanners to run."
    required: false
    default: "vuln,secret,misconfig"
  severity:
    description: "Comma-separated severities to report."
    required: false
    default: "CRITICAL,HIGH"
  ignore-unfixed:
    description: "Ignore vulnerabilities with no published fix."
    required: false
    default: "false"
  exit-code:
    description: "Set to 0 to report findings without failing the job."
    required: false
    default: "1"
  trivyignores:
    description: "Comma-separated .trivyignore files."
    required: false
    default: ""
  upload-sarif:
    description: "Also upload results to GitHub code scanning. Needs security-events: write."
    required: false
    default: "true"
  artifact-name:
    description: "Report artifact name. Must be unique within a run."
    required: false
    default: "trivy-report"

outputs:
  total:
    description: "Total findings."
    value: ${{ steps.report.outputs.total }}
  critical:
    description: "CRITICAL findings."
    value: ${{ steps.report.outputs.critical }}
  high:
    description: "HIGH findings."
    value: ${{ steps.report.outputs.high }}
  fixable:
    description: "Vulnerabilities with a published fix."
    value: ${{ steps.report.outputs.fixable }}
  report:
    description: "Path to the rendered Markdown report."
    value: trivy-report.md

runs:
  using: "composite"
  steps:
    # Scan once to JSON. Gating happens in the report step so a failing scan still
    # produces a readable report instead of an empty red job.
    - name: Run Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: ${{ inputs.image-ref != '' && 'image' || inputs.scan-type }}
        scan-ref: ${{ inputs.scan-ref }}
        image-ref: ${{ inputs.image-ref }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        format: json
        output: trivy-results.json
        exit-code: "0"

    - name: Convert to SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: convert
        image-ref: trivy-results.json
        severity: ""
        vuln-type: ""
        format: sarif
        output: trivy-results.sarif

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif

    - name: Report
      id: report
      shell: bash
      env:
        REPORT_JSON: trivy-results.json
        REPORT_MD: trivy-report.md
        REPORT_TARGET: ${{ inputs.image-ref != '' && inputs.image-ref || inputs.scan-ref }}
        REPORT_SEVERITY: ${{ inputs.severity }}
        REPORT_EXIT_CODE: ${{ inputs.exit-code }}
      run: python3 "${{ github.action_path }}/trivy-report.py"


